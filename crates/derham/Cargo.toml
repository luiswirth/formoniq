[package]
name = "derham"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Discrete differential forms on a simplicial manifold: cochains read as forms, Whitney interpolation, the de Rham map, and the degrees of freedom."
repository = "https://github.com/luiswirth/formoniq"
readme = "README.md"
keywords = ["de-rham", "cochain", "whitney", "fem"]
categories = ["mathematics", "science"]

[dependencies]
multialgebra = { path = "../multialgebra", version = "0.2.0" }
glatt = { path = "../glatt", version = "0.2.0" }
simplicial = { path = "../simplicial", version = "0.2.0" }
regge = { path = "../regge", version = "0.2.0" }
coorder = { path = "../coorder", version = "0.2.0" }
metric = { path = "../metric", version = "0.2.0" }
multiindex = { path = "../multiindex", version = "0.2.0" }

nalgebra = "0.35.0"
nalgebra-sparse = "0.12.0"

approx = "0.5.1"

serde = { version = "1.0.228", features = ["derive"], optional = true }

[features]
serde = ["dep:serde", "nalgebra/serde-serialize", "simplicial/serde", "regge/serde"]
