[package]
name = "multialgebra"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "The free tensor power of a vector space, its exterior and symmetric quotients, and tensor products of all three."
repository = "https://github.com/luiswirth/formoniq"
readme = "README.md"
keywords = ["exterior-algebra", "symmetric-algebra", "multilinear", "tensor"]
categories = ["mathematics"]

[dependencies]
multiindex = { path = "../multiindex", version = "0.2.0" }

nalgebra = "0.35.0"
num-complex = "0.4.6"
num-rational = "0.4.2"
num-traits = "0.2.19"
tinyvec = { version = "1.11.0", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
divan = "0.1.21"
num-complex = "0.4.6"
num-rational = "0.4.2"
approx = "0.5.1"

[[bench]]
name = "algebra"
harness = false
